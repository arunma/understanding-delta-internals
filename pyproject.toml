[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-internals"
version = "0.1.0"
description = "A walkthrough of Delta Lake commit, snapshot, and streaming internals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
delta-inspect = "delta_inspect.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
spark = ["pyspark>=3.5.0,<4", "delta-spark>=3.2.0,<4"]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
